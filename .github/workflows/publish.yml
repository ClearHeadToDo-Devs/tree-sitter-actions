name: Publish

# Publishes the crate to crates.io when a version tag is pushed, using crates.io
# trusted publishing: GitHub's OIDC identity is exchanged for a short-lived
# token, so no registry secret is stored. The crates-io environment requires a
# maintainer's approval, so pushing a tag queues the publish but does not run it.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout grammar
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "tag $GITHUB_REF_NAME does not match crate version $version" >&2
            exit 1
          }

      - name: Check linked grammar metadata and Rust binding
        run: cargo test

      - name: Get a crates.io token
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
