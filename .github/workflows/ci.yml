name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          # Node 26 is the version the native binding was repaired for (see the
          # 0.10.0 CHANGELOG); CI guards that compatibility.
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Run full suite
        run: npm run test:all
